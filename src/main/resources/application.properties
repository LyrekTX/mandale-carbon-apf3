spring.application.name=mandale-carbon
spring.thymeleaf.cache=false

# Ejemplo: MC_DB_URL=jdbc:sqlserver://localhost:1433;databaseName=bd_mandale_carbon;encrypt=true;trustServerCertificate=true
spring.datasource.url=${MC_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=bd_mandale_carbon;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${MC_DB_USER:sa}
spring.datasource.password=${MC_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
app.bootstrap.email=${MC_ADMIN_EMAIL:smith@gmail.com}
app.bootstrap.password=${MC_ADMIN_PASSWORD:12345678910}
